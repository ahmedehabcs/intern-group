server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular is a single-page app with client-side routing. A hard refresh on
    # a deep link such as /auth/reset-password asks nginx for a file that does
    # not exist, so unmatched paths fall back to index.html and let the Angular
    # router resolve them. Without this, every refresh outside / returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Production builds use outputHashing: all, so asset filenames change on
    # every content change and can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached, or clients keep loading the old bundle
    # names after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
