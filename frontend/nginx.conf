server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload ceiling - the default 1m rejects larger multipart requests.
    client_max_body_size 10m;

    # --- API reverse proxy ---------------------------------------------------
    # Every Spring controller is mapped under /api (@RequestMapping("/api/...")),
    # so this one prefix covers the whole API. Because the browser now calls the
    # API on the same origin it loaded the app from, there is no cross-origin
    # request at all - no CORS preflight, and no server hostname baked into the
    # Angular bundle at build time.
    #
    # proxy_pass without a URI part forwards the original path untouched, so
    # /api/auth/login arrives at the backend as /api/auth/login.
    location /api/ {
        # Docker's embedded DNS. Resolving at request time rather than at
        # startup means restarting the backend container does not leave nginx
        # holding a stale IP - the usual "works until you redeploy" trap.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --- Static assets -------------------------------------------------------
    # Production builds use outputHashing: all, so asset filenames change on
    # every content change and can be cached indefinitely.
    location ~* \.(?:js|css|woff2?|png|jpe?g|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached, or clients keep loading the old bundle
    # names after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- SPA fallback --------------------------------------------------------
    # Angular does client-side routing. A hard refresh on a deep link such as
    # /auth/reset-password asks nginx for a file that does not exist, so
    # unmatched paths fall back to index.html and let the Angular router resolve
    # them. Without this, every refresh outside / returns 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
