<header class="site-header">
  <a class="brand" routerLink="/" aria-label="Talabaty home">
    <span class="brand-mark">T</span>
    <span>Talabaty</span>
  </a>

  <button class="location" type="button">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
    <span><small>Delivering to</small>Al-Mansour, Baghdad</span>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 10 4 4 4-4"></path></svg>
  </button>

  <a class="nav-search" routerLink="/search" aria-label="Open search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
    <span>Search dishes or restaurants</span>
  </a>

  <button
    class="nav-theme"
    type="button"
    (click)="toggleTheme()"
    [attr.aria-label]="isDark ? 'Switch to light mode' : 'Switch to dark mode'"
    [title]="isDark ? 'Light mode' : 'Dark mode'"
  >
    @if (isDark) {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
      </svg>
    } @else {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.7 15.1A8.5 8.5 0 0 1 8.9 3.3 8.5 8.5 0 1 0 20.7 15.1Z"></path>
      </svg>
    }
  </button>

  <div class="nav-actions">
    <a class="login-link" routerLink="/auth/login">Sign in</a>
    <button class="cart-button" type="button" aria-label="Open cart">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.3 10.1a2 2 0 0 0 2 1.5h7.9a2 2 0 0 0 2-1.6L21 7H6"></path><circle cx="10" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle></svg>
      <span>2</span>
    </button>
  </div>

</header>
