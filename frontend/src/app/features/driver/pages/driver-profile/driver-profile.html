<main class="min-h-screen bg-(--background) px-4 py-6 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-3xl">

    <header class="border-b border-(--line) pb-6">
      <a routerLink="/driver/available" class="text-sm text-(--text-soft) transition hover:text-(--text)">
        ← Deliveries
      </a>

      <h1 class="mt-5 text-2xl text-(--text)">
        Driver profile
      </h1>

      <p class="mt-1 text-sm text-(--text-soft)">
        Manage your driver information.
      </p>
    </header>

    @if (loading()) {
    <div class="mt-8 space-y-4">
      <div class="h-12 animate-pulse rounded-(--radius) bg-(--surface-2)"></div>
      <div class="h-12 animate-pulse rounded-(--radius) bg-(--surface-2)"></div>
      <div class="h-12 animate-pulse rounded-(--radius) bg-(--surface-2)"></div>
    </div>
    } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-8">

      <div class="divide-y divide-(--line) border-y border-(--line)">

        <label class="block py-5">
          <span class="text-sm text-(--text)">Email</span>

          <input [value]="email()" readonly
            class="mt-2 w-full border-0 bg-(--surface-2) px-3 py-3 text-sm text-(--text-soft) outline-none" />
        </label>

        <label class="block py-5">
          <span class="text-sm text-(--text)">Name</span>

          <input formControlName="name"
            class="mt-2 w-full border-b border-(--line) bg-transparent px-0 py-3 text-sm text-(--text) outline-none focus:border-(--brand)" />
        </label>

        <label class="block py-5">
          <span class="text-sm text-(--text)">Phone</span>

          <input formControlName="phoneNumber"
            class="mt-2 w-full border-b border-(--line) bg-transparent px-0 py-3 text-sm text-(--text) outline-none focus:border-(--brand)" />
        </label>

        <label class="block py-5">
          <span class="text-sm text-(--text)">Vehicle type</span>

          <input formControlName="vehicleType"
            class="mt-2 w-full border-b border-(--line) bg-transparent px-0 py-3 text-sm text-(--text) outline-none focus:border-(--brand)" />
        </label>

        <label class="block py-5">
          <span class="text-sm text-(--text)">License number</span>

          <input formControlName="licenseNumber"
            class="mt-2 w-full border-b border-(--line) bg-transparent px-0 py-3 text-sm text-(--text) outline-none focus:border-(--brand)" />
        </label>

        <label class="block py-5">
          <span class="text-sm text-(--text)">National ID</span>

          <input formControlName="nationalId"
            class="mt-2 w-full border-b border-(--line) bg-transparent px-0 py-3 text-sm text-(--text) outline-none focus:border-(--brand)" />
        </label>

      </div>

      @if (error()) {
      <p class="mt-5 text-sm text-red-600">
        {{ error() }}
      </p>
      }

      @if (message()) {
      <p class="mt-5 text-sm text-emerald-600">
        {{ message() }}
      </p>
      }

      <div class="mt-6 flex justify-end">
        <button type="submit" [disabled]="form.invalid || submitting()"
          class="rounded-(--radius) bg-(--brand) px-6 py-3 text-sm text-white transition hover:opacity-90 disabled:opacity-50">
          {{ submitting() ? 'Saving…' : 'Save profile' }}
        </button>
      </div>

    </form>
    }
  </div>
</main>
