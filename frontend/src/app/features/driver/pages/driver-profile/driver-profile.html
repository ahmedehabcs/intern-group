<main class="min-h-screen bg-(--bg) px-4 py-6 sm:px-6 lg:px-8">
  <div class="mx-auto max-w-3xl">
    <header class="border-b border-(--line) pb-6">
      <div class="flex justify-end gap-2">
        <button
          type="button"
          (click)="toggleTheme()"
          class="icon-action"
          [attr.aria-label]="isDark() ? 'Use light theme' : 'Use dark theme'"
          [title]="isDark() ? 'Use light theme' : 'Use dark theme'"
        >
          @if (isDark()) {
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
              />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z" /></svg>
          }
        </button>
        <button
          type="button"
          (click)="logout()"
          class="icon-action"
          aria-label="Sign out"
          title="Sign out"
        >
          <svg viewBox="0 0 24 24">
            <path d="M10 17l5-5-5-5M15 12H3M14 4h6a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-6" />
          </svg>
        </button>
      </div>
      <a
        routerLink="/driver/available"
        class="text-sm text-(--text-soft) transition hover:text-(--text)"
      >
        ← Deliveries
      </a>

      <h1 class="mt-5 text-2xl text-(--text)">Driver profile</h1>

      <p class="mt-1 text-sm text-(--text-soft)">Manage your driver information.</p>
    </header>

    @if (loading()) {
      <div class="mt-8 space-y-4">
        <div class="h-12 animate-pulse rounded-(--radius) bg-(--surface-2)"></div>
        <div class="h-12 animate-pulse rounded-(--radius) bg-(--surface-2)"></div>
        <div class="h-12 animate-pulse rounded-(--radius) bg-(--surface-2)"></div>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-8">
        <div class="divide-y divide-(--line) border-y border-(--line)">
          <label class="block py-5">
            <span class="text-sm text-(--text)">Email</span>

            <input
              [value]="email()"
              readonly
              class="mt-2 w-full border-0 bg-(--surface-2) px-3 py-3 text-sm text-(--text-soft) outline-none"
            />
          </label>

          <label class="block py-5">
            <span class="text-sm text-(--text)">Name</span>

            <input
              formControlName="name"
              class="mt-2 w-full border-b border-(--line) bg-transparent px-0 py-3 text-sm text-(--text) outline-none focus:border-(--brand)"
            />
          </label>

          <label class="block py-5">
            <span class="text-sm text-(--text)">Phone</span>

            <input
              formControlName="phoneNumber"
              class="mt-2 w-full border-b border-(--line) bg-transparent px-0 py-3 text-sm text-(--text) outline-none focus:border-(--brand)"
            />
          </label>

          <label class="block py-5">
            <span class="text-sm text-(--text)">Vehicle type</span>

            <input
              formControlName="vehicleType"
              class="mt-2 w-full border-b border-(--line) bg-transparent px-0 py-3 text-sm text-(--text) outline-none focus:border-(--brand)"
            />
          </label>

          <label class="block py-5">
            <span class="text-sm text-(--text)">License number</span>

            <input
              formControlName="licenseNumber"
              class="mt-2 w-full border-b border-(--line) bg-transparent px-0 py-3 text-sm text-(--text) outline-none focus:border-(--brand)"
            />
          </label>

          <label class="block py-5">
            <span class="text-sm text-(--text)">National ID</span>

            <input
              formControlName="nationalId"
              class="mt-2 w-full border-b border-(--line) bg-transparent px-0 py-3 text-sm text-(--text) outline-none focus:border-(--brand)"
            />
          </label>
        </div>

        @if (error()) {
          <p class="mt-5 text-sm text-red-600">
            {{ error() }}
          </p>
        }

        @if (message()) {
          <p class="mt-5 text-sm text-emerald-600">
            {{ message() }}
          </p>
        }

        <div class="mt-6 flex justify-end">
          <button
            type="submit"
            [disabled]="form.invalid || submitting()"
            class="rounded-(--radius) bg-(--brand) px-6 py-3 text-sm text-white transition hover:opacity-90 disabled:opacity-50"
          >
            {{ submitting() ? 'Saving…' : 'Save profile' }}
          </button>
        </div>
      </form>
    }
  </div>
</main>
