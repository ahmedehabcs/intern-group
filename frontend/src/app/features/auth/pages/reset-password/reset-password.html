<main class="mx-auto flex min-h-screen max-w-md items-center p-6"><section class="w-full"><h1 class="text-3xl font-black">Reset password</h1><form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4"><label class="block">Email<input formControlName="email" type="email" class="mt-1 w-full rounded-xl border p-3"></label><label class="block">Reset code<input formControlName="otp" class="mt-1 w-full rounded-xl border p-3"></label><label class="block">New password<input formControlName="password" type="password" class="mt-1 w-full rounded-xl border p-3"></label><label class="block">Confirm password<input formControlName="confirmPassword" type="password" class="mt-1 w-full rounded-xl border p-3"></label>@if(form.hasError('passwordsMismatch')&&form.controls.confirmPassword.touched){<p class="text-sm text-red-600">Passwords do not match.</p>}@if(error()){<p class="rounded-xl bg-red-50 p-3 text-red-700">{{error()}}</p>}<button [disabled]="form.invalid||submitting()" class="w-full rounded-xl bg-orange-500 p-3 font-bold text-white">{{submitting()?'Updating…':'Update password'}}</button></form><a routerLink="/auth/login" class="mt-5 block text-center text-orange-600">Back to login</a></section></main>
