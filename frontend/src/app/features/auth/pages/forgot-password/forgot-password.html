<div class="auth-page forgot-page">
  <section class="forgot-shell">
    <div class="auth-icon">
      <svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"></circle><path d="m11 12 8-8m-3 3 3 3m-6 0 3 3"></path></svg>
    </div>
    <h1 class="auth-heading">Forgot password?</h1>
    <p class="auth-copy">Don't worry, it happens to the best of us. Enter your email and we'll send you a secure link to reset your access.</p>

    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="forgot-email">Email Address</label>
        <div class="input-shell">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M16 8v6a2 2 0 0 0 4 0v-2a8 8 0 1 0-3 6"></path></svg>
          <input id="forgot-email" type="email" name="email" [(ngModel)]="email" placeholder="name@company.com" required />
        </div>
      </div>
      <button class="primary-btn" type="submit">Send Reset Link <span>→</span></button>
    </form>

    <div class="back-divider"></div>
    <a class="back-link" routerLink="/auth/login">← &nbsp; Back to Login</a>
  </section>
</div>
