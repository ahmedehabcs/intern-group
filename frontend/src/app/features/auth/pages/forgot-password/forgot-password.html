<main class="mx-auto flex min-h-screen max-w-md items-center p-6">
  <section class="w-full">
    <h1 class="text-3xl font-black">Forgot password?</h1>
    <p class="mt-2 text-slate-600">Enter your email and we will send a reset code.</p>
    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4">
      <label class="block"
        >Email<input
          formControlName="email"
          type="email"
          autocomplete="email"
          class="mt-1 w-full rounded-xl border p-3"
      /></label>
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <p class="text-sm text-red-600">Enter a valid email address.</p>
      }
      @if (error()) {
        <p class="rounded-xl bg-red-50 p-3 text-red-700">{{ error() }}</p>
      }
      <button
        [disabled]="form.invalid || submitting()"
        class="w-full rounded-xl bg-orange-500 p-3 font-bold text-white"
      >
        {{ submitting() ? 'Sending…' : 'Send reset code' }}
      </button>
    </form>
    <a routerLink="/auth/login" class="mt-5 block text-center text-orange-600">Back to login</a>
  </section>
</main>
