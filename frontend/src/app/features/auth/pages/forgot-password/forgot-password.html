<div class="auth-page forgot-page">
  <section class="forgot-shell">
    <div class="intro-row">
      <div class="auth-icon">
        <svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7v5a7 7 0 0 1-14 0V9a7 7 0 0 1 7-7Zm0 2a5 5 0 0 0-5 5v5a5 5 0 0 0 10 0V9a5 5 0 0 0-5-5Zm0 8.5a1.5 1.5 0 0 1 1.5 1.5v2a1.5 1.5 0 0 1-3 0v-2A1.5 1.5 0 0 1 12 12.5Z"></path></svg>
      </div>
      <div>
        <span class="eyebrow">Password recovery</span>
        <h1 class="auth-heading">Reset your password</h1>
      </div>
    </div>

    <p class="auth-copy">
      Enter the email address associated with your account and we’ll send a secure link so you can choose a new password.
    </p>

    <form (ngSubmit)="submit()" novalidate>
      <div class="field">
        <label for="forgot-email">Email address</label>
        <div class="input-shell">
          <svg viewBox="0 0 24 24"><path d="M3 7.5A3.5 3.5 0 0 1 6.5 4h11A3.5 3.5 0 0 1 21 7.5v9A3.5 3.5 0 0 1 17.5 20h-11A3.5 3.5 0 0 1 3 16.5v-9Z" fill="none"></path><path d="M3 7.5 12 13 21 7.5" fill="none"></path></svg>
          <input
            id="forgot-email"
            type="email"
            name="email"
            [(ngModel)]="email"
            placeholder="name@company.com"
            [disabled]="isSubmitting"
            autocomplete="email"
            required
          />
        </div>
        <p class="field-error" *ngIf="errorMessage">{{ errorMessage }}</p>
      </div>

      <button class="primary-btn" type="submit" [disabled]="isSubmitting">
        <span *ngIf="!isSubmitting">Send reset link</span>
        <span *ngIf="isSubmitting">Sending...</span>
        <span aria-hidden="true">→</span>
      </button>
    </form>

    <div class="back-divider"></div>
    <a class="back-link" routerLink="/auth/login">← Back to login</a>
  </section>
</div>
