<div class="min-h-screen grid place-items-center px-6 py-10 bg-[radial-gradient(circle_at_18%_18%,rgba(174,80,0,.14),transparent_24%),radial-gradient(circle_at_85%_12%,rgba(255,192,72,.12),transparent_18%),var(--bg)]">
  <section class="w-full max-w-[520px] rounded-[36px] border border-white/45 bg-[linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.92))] px-10 py-12 shadow-[0_24px_80px_rgba(15,23,42,0.12)] sm:px-8 sm:py-10">
    <div class="grid gap-4">
      <div class="grid gap-4">
        <div class="grid h-14 w-14 place-items-center rounded-[20px] bg-[linear-gradient(135deg,rgba(59,130,246,.16),rgba(59,130,246,.06))] text-[var(--brand)] shadow-[inset_0_0_0_1px_rgba(59,130,246,.12)]">
          <svg viewBox="0 0 24 24" class="h-6 w-6 fill-current"><path d="M12 2a7 7 0 0 1 7 7v5a7 7 0 0 1-14 0V9a7 7 0 0 1 7-7Zm0 2a5 5 0 0 0-5 5v5a5 5 0 0 0 10 0V9a5 5 0 0 0-5-5Zm0 8.5a1.5 1.5 0 0 1 1.5 1.5v2a1.5 1.5 0 0 1-3 0v-2A1.5 1.5 0 0 1 12 12.5Z"></path></svg>
        </div>

        <span class="inline-flex rounded-full bg-[rgba(59,130,246,.1)] px-4 py-2 text-[12px] font-bold uppercase tracking-[0.12em] text-[var(--brand)]">
          Password recovery
        </span>
        <h1 class="text-[clamp(2rem,2.4vw,2.7rem)] font-[Playfair_Display] leading-[1.05] text-[var(--text)]">
          Reset your password
        </h1>
      </div>

      <p class="mt-2 text-base leading-7 text-[var(--text-soft)]">
        Enter the email address associated with your account and we’ll send a secure link so you can choose a new password.
      </p>

      <form class="mt-8 grid gap-6" (ngSubmit)="submit()" novalidate>
        <div class="grid gap-2">
          <label for="forgot-email" class="text-sm font-bold text-[var(--text)]">Email address</label>
          <div class="flex items-center gap-3 rounded-[18px] border border-[var(--border)] bg-[var(--surface-2)] px-4 transition duration-200 focus-within:border-[var(--brand)] focus-within:bg-[var(--surface)]">
            <svg viewBox="0 0 24 24" class="h-5 w-5 text-[var(--muted)]"><path d="M3 7.5A3.5 3.5 0 0 1 6.5 4h11A3.5 3.5 0 0 1 21 7.5v9A3.5 3.5 0 0 1 17.5 20h-11A3.5 3.5 0 0 1 3 16.5v-9Z" fill="none"></path><path d="M3 7.5 12 13 21 7.5" fill="none"></path></svg>
            <input
              id="forgot-email"
              type="email"
              name="email"
              [(ngModel)]="email"
              placeholder="name@company.com"
              [disabled]="isSubmitting"
              autocomplete="email"
              required
              class="w-full bg-transparent text-[var(--text)] outline-none placeholder:text-[var(--muted)]"
            />
          </div>
          <p class="text-sm text-red-600" *ngIf="errorMessage">{{ errorMessage }}</p>
          <p class="text-sm text-[#348c60]" *ngIf="successMessage">{{ successMessage }}</p>
        </div>

        <button
          class="flex h-14 w-full items-center justify-center gap-3 rounded-[18px] bg-gradient-to-br from-[var(--brand)] to-[#2563eb] px-6 font-bold text-white transition duration-200 hover:-translate-y-0.5 hover:shadow-[0_18px_30px_rgba(37,99,235,0.2)] disabled:opacity-70 disabled:cursor-not-allowed"
          type="submit"
          [disabled]="isSubmitting"
        >
          <span *ngIf="!isSubmitting">Send reset link</span>
          <span *ngIf="isSubmitting">Sending...</span>
          <span aria-hidden="true">→</span>
        </button>
      </form>

      <div class="mt-8 h-px bg-[var(--line)]"></div>
      <a class="block text-center text-sm font-bold text-[var(--text-soft)]" routerLink="/auth/login">← Back to login</a>
    </div>
  </section>
</div>
