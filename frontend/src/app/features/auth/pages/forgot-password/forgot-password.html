<main class="flex min-h-screen items-center justify-center bg-(--bg) px-6 py-12">
  <section class="w-full max-w-110">

    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-3xl font-semibold tracking-tight text-(--text)">
        Forgot password?
      </h1>

      <p class="mt-2 text-sm leading-6 text-(--text-soft)">
        Enter your email and we will send a reset code.
      </p>
    </header>

    <!-- Form Card -->
    <div class="rounded-(--radius) border border-(--line) bg-(--surface) p-7 shadow-(--shadow-sm) sm:p-8">
      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">

        <!-- Email -->
        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-(--text)">
            Email
          </label>

          <input id="email" formControlName="email" type="email" autocomplete="email" placeholder="you@example.com"
            class="h-12 w-full rounded-(--radius) border border-(--line) bg-(--surface) px-4 text-sm text-(--text) outline-none transition placeholder:text-(--muted) focus:border-(--brand) focus:ring-1 focus:ring-(--brand)" />

          @if (form.controls.email.touched && form.controls.email.invalid) {
          <p class="mt-2 text-xs text-red-600">
            Enter a valid email address.
          </p>
          }
        </div>

        <!-- Error -->
        @if (error()) {
        <p class="rounded-(--radius) border border-(--line) bg-(--brand-soft) px-4 py-3 text-sm text-(--brand)">
          {{ error() }}
        </p>
        }

        <!-- Submit -->
        <button [disabled]="form.invalid || submitting()"
          class="h-12 w-full rounded-(--radius) bg-(--brand) px-4 text-sm font-semibold text-white transition hover:bg-(--brand-hover) disabled:cursor-not-allowed disabled:opacity-50">
          {{ submitting() ? 'Sending…' : 'Send reset code' }}
        </button>
      </form>

      <!-- Back to Login -->
      <div class="mt-6 border-t border-(--line) pt-6 text-center">
        <a routerLink="/auth/login" class="text-sm font-medium text-(--brand) transition hover:text-(--brand-hover)">
          Back to login
        </a>
      </div>
    </div>
  </section>
</main>
