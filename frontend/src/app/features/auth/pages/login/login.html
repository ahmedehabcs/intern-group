<div class="login-page">
  <section class="login-visual" aria-label="Premium dining experience">
    <div class="visual-brand"><span>T</span> Talabaty</div>
    <div class="delivery-badge">
      <span>↯</span>
      <div><small>Average Delivery</small><strong>24 Mins</strong></div>
    </div>
    <div class="visual-copy">
      <span class="premium-chip">Fast local delivery</span>
      <h2>Good food,<br /><em>right on time.</em></h2>
      <p>Order from restaurants you know and love.</p>
    </div>
  </section>

  <section class="login-content">
    <div class="login-inner">
      <div class="login-title">
        <span class="mobile-brand"><b>T</b> Talabaty</span>
        <h1 class="auth-heading">Welcome back</h1>
        <p class="auth-copy">Sign in to order your favourites.</p>
      </div>

      <form class="login-card" (ngSubmit)="submit()">
        <div class="field">
          <label for="login-email">Email Address</label>
          <div class="input-shell">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
            <input id="login-email" type="email" name="email" [(ngModel)]="email" placeholder="name@example.com" required />
          </div>
        </div>

        <div class="field">
          <div class="password-label">
            <label for="login-password">Password</label>
            <a routerLink="/auth/forgot-password">Forgot Password?</a>
          </div>
          <div class="input-shell">
            <svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><circle cx="12" cy="15" r="1"></circle></svg>
            <input id="login-password" [type]="showPassword ? 'text' : 'password'" name="password" [(ngModel)]="password" placeholder="••••••••" required />
            <button class="show-password" type="button" (click)="showPassword = !showPassword" aria-label="Toggle password visibility">
              <svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle></svg>
            </button>
          </div>
        </div>

        <button class="primary-btn" type="submit">Sign In</button>

        <div class="or"><span></span><b>OR</b><span></span></div>

        <button class="social-btn" type="button">
          <span class="google-g">G</span>
          Continue with Google
        </button>
        <a class="social-btn email-button" routerLink="/auth/register">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path></svg>
          Continue with Email
        </a>
      </form>

      <p class="auth-switch">Don't have an account? <a routerLink="/auth/register">Register Now</a></p>
    </div>
  </section>
</div>
