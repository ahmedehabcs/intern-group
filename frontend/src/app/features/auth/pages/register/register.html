<main class="flex min-h-screen items-center justify-center bg-(--bg) px-6 py-12">
  <section class="w-full max-w-140">

    <!-- Header -->
    <header class="mb-8">
      <h1 class="text-3xl font-semibold tracking-tight text-(--text)">
        Create an account
      </h1>

      <p class="mt-2 text-sm text-(--text-soft)">
        Create your account to get started.
      </p>
    </header>

    <!-- Form Card -->
    <div class="rounded-(--radius) border border-(--line) bg-(--surface) p-7 shadow-(--shadow-sm) sm:p-8">
      <form [formGroup]="form" (ngSubmit)="submit()" class="grid gap-6 sm:grid-cols-2">

        <!-- Account Type -->
        <div class="sm:col-span-2">
          <label for="role" class="mb-2 block text-sm font-medium text-(--text)">
            Account type
          </label>

          <select id="role" formControlName="role"
            class="h-12 w-full rounded-(--radius) border border-(--line) bg-(--surface) px-4 text-sm text-(--text) outline-none transition focus:border-(--brand) focus:ring-1 focus:ring-(--brand)">
            <option value="CUSTOMER">Customer</option>
            <option value="DRIVER">Delivery driver</option>
          </select>
        </div>

        <!-- Name -->
        <div>
          <label for="name" class="mb-2 block text-sm font-medium text-(--text)">
            Name
          </label>

          <input id="name" formControlName="name" placeholder="Your name"
            class="h-12 w-full rounded-(--radius) border border-(--line) bg-(--surface) px-4 text-sm text-(--text) outline-none transition placeholder:text-(--muted) focus:border-(--brand) focus:ring-1 focus:ring-(--brand)" />
        </div>

        <!-- Email -->
        <div>
          <label for="email" class="mb-2 block text-sm font-medium text-(--text)">
            Email
          </label>

          <input id="email" formControlName="email" type="email" placeholder="you@example.com"
            class="h-12 w-full rounded-(--radius) border border-(--line) bg-(--surface) px-4 text-sm text-(--text) outline-none transition placeholder:text-(--muted) focus:border-(--brand) focus:ring-1 focus:ring-(--brand)" />
        </div>

        <!-- Phone -->
        <div>
          <label for="phoneNumber" class="mb-2 block text-sm font-medium text-(--text)">
            Phone
          </label>

          <input id="phoneNumber" formControlName="phoneNumber" placeholder="Phone number"
            class="h-12 w-full rounded-(--radius) border border-(--line) bg-(--surface) px-4 text-sm text-(--text) outline-none transition placeholder:text-(--muted) focus:border-(--brand) focus:ring-1 focus:ring-(--brand)" />
        </div>

        <!-- Password -->
        <div>
          <label for="password" class="mb-2 block text-sm font-medium text-(--text)">
            Password
          </label>

          <input id="password" formControlName="password" type="password" placeholder="Create a password"
            class="h-12 w-full rounded-(--radius) border border-(--line) bg-(--surface) px-4 text-sm text-(--text) outline-none transition placeholder:text-(--muted) focus:border-(--brand) focus:ring-1 focus:ring-(--brand)" />
        </div>

        <!-- Driver Fields -->
        @if (form.controls.role.value === 'DRIVER') {

        <!-- Vehicle Type -->
        <div>
          <label for="vehicleType" class="mb-2 block text-sm font-medium text-(--text)">
            Vehicle type
          </label>

          <input id="vehicleType" formControlName="vehicleType" placeholder="e.g. Motorcycle"
            class="h-12 w-full rounded-(--radius) border border-(--line) bg-(--surface) px-4 text-sm text-(--text) outline-none transition placeholder:text-(--muted) focus:border-(--brand) focus:ring-1 focus:ring-(--brand)" />
        </div>

        <!-- License Number -->
        <div>
          <label for="licenseNumber" class="mb-2 block text-sm font-medium text-(--text)">
            License number
          </label>

          <input id="licenseNumber" formControlName="licenseNumber" placeholder="License number"
            class="h-12 w-full rounded-(--radius) border border-(--line) bg-(--surface) px-4 text-sm text-(--text) outline-none transition placeholder:text-(--muted) focus:border-(--brand) focus:ring-1 focus:ring-(--brand)" />
        </div>

        <!-- National ID -->
        <div class="sm:col-span-2">
          <label for="nationalId" class="mb-2 block text-sm font-medium text-(--text)">
            National ID
          </label>

          <input id="nationalId" formControlName="nationalId" placeholder="National ID"
            class="h-12 w-full rounded-(--radius) border border-(--line) bg-(--surface) px-4 text-sm text-(--text) outline-none transition placeholder:text-(--muted) focus:border-(--brand) focus:ring-1 focus:ring-(--brand)" />
        </div>
        }

        <!-- Error -->
        @if (error()) {
        <p
          class="sm:col-span-2 rounded-(--radius) border border-(--line) bg-(--brand-soft) px-4 py-3 text-sm text-(--brand)">
          {{ error() }}
        </p>
        }

        <!-- Submit -->
        <button [disabled]="form.invalid || submitting()"
          class="sm:col-span-2 h-12 rounded-(--radius) bg-(--brand) px-4 text-sm font-semibold text-white transition hover:bg-(--brand-hover) disabled:cursor-not-allowed disabled:opacity-50">
          {{ submitting() ? 'Creating…' : 'Create account' }}
        </button>
      </form>

      <!-- Login Link -->
      <div class="mt-6 border-t border-(--line) pt-6 text-center text-sm">
        <a routerLink="/auth/login" class="font-medium text-(--brand) transition hover:text-(--brand-hover)">
          Already registered? Sign in
        </a>
      </div>
    </div>
  </section>
</main>
