<div class="register-page">
  <div class="register-shell">
    <aside class="register-story">
      <div class="story-brand"><span class="story-logo">T</span> Talabaty</div>
      <div class="story-message">
        <h2>Good food starts here.</h2>
        <p>Create an account, pick a restaurant, and place your order.</p>
      </div>
      <span class="story-note">Simple. Fast. Delivered.</span>
    </aside>

    <section class="register-form-area">
      <div class="register-form-inner">
        <span class="eyebrow">Create account</span>
        <h1 class="auth-heading">Create your account</h1>
        <p class="auth-copy">Enter your details to get started.</p>

        <form class="register-form" (ngSubmit)="submit()">
          <div class="input-shell">
            <input type="text" name="username" [(ngModel)]="username" placeholder="Username" required />
          </div>
          <div class="input-shell">
            <input type="email" name="email" [(ngModel)]="email" placeholder="Email Address" required />
          </div>
          <div class="password-row">
            <div class="input-shell"><input type="password" name="password" [(ngModel)]="password" placeholder="Password" required /></div>
            <div class="input-shell"><input type="password" name="confirm" [(ngModel)]="confirm" placeholder="Confirm" required /></div>
          </div>

          <label class="terms">
            <input type="checkbox" name="agreed" [(ngModel)]="agreed" required />
            <span>I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
          </label>

          <button class="primary-btn create-btn" type="submit">Create Account <span>→</span></button>
        </form>

        <div class="or"><span></span><b>OR CONTINUE WITH</b><span></span></div>
        <button class="social-btn google-button" type="button">
          <span class="google-g">G</span>
          Continue with Google
        </button>
        <p class="auth-switch">Already have an account? <a routerLink="/auth/login">Login</a></p>
      </div>
    </section>
  </div>
</div>
