<main class="mx-auto max-w-xl p-6 sm:py-12"><h1 class="text-4xl font-black">Create an account</h1><form [formGroup]="form" (ngSubmit)="submit()" class="mt-8 grid gap-4 sm:grid-cols-2"><label class="sm:col-span-2">Account type<select formControlName="role" class="mt-1 w-full rounded-xl border p-3"><option value="CUSTOMER">Customer</option><option value="DRIVER">Delivery driver</option></select></label><label>Name<input formControlName="name" class="mt-1 w-full rounded-xl border p-3"></label><label>Email<input formControlName="email" type="email" class="mt-1 w-full rounded-xl border p-3"></label><label>Phone<input formControlName="phoneNumber" class="mt-1 w-full rounded-xl border p-3"></label><label>Password<input formControlName="password" type="password" class="mt-1 w-full rounded-xl border p-3"></label>@if(form.controls.role.value==='DRIVER'){<label>Vehicle type<input formControlName="vehicleType" class="mt-1 w-full rounded-xl border p-3"></label><label>License number<input formControlName="licenseNumber" class="mt-1 w-full rounded-xl border p-3"></label><label class="sm:col-span-2">National ID<input formControlName="nationalId" class="mt-1 w-full rounded-xl border p-3"></label>}@if(error()){<p class="sm:col-span-2 rounded-xl bg-red-50 p-3 text-red-700">{{error()}}</p>}<button [disabled]="form.invalid||submitting()" class="sm:col-span-2 rounded-xl bg-orange-500 p-3 font-bold text-white">{{submitting()?'Creating…':'Create account'}}</button></form><a routerLink="/auth/login" class="mt-5 block text-center text-orange-600">Already registered? Sign in</a></main>
