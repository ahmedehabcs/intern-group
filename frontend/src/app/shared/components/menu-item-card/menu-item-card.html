<a [routerLink]="['/menu-items', item().id]"
    class="group flex h-full overflow-hidden rounded-(--radius) border border-(--line) bg-(--surface) shadow-(--shadow-sm) transition hover:shadow-(--shadow-lg)">
    <div class="min-w-0 flex-1 p-4">
        <h3 class="text-(--text)">
            {{ item().name }}
        </h3>

        <p class="mt-1 line-clamp-2 text-sm leading-5 text-(--text-soft)">
            {{ item().description }}
        </p>

        <p class="mt-4 text-(--brand)">
            EGP {{ item().basePrice }}
        </p>
    </div>

    <img appImageFallback class="aspect-square w-32 object-cover sm:w-36" [src]="item().imageUrl || fallback"
        [alt]="item().name" />
</a>
