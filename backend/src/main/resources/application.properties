spring.application.name=backend

# -----------------------------------------------------------------------------
# Configuration is read from the environment with a local-development fallback
# after the colon. Nothing secret is committed here: every ${VAR:default} below
# either has a harmless local default or must be supplied by the environment.
# See .env.example at the repository root for the full list.
# -----------------------------------------------------------------------------

# --- Database ---------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/talabaty_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.main.banner-mode=off

# Browser origins allowed to call this API (comma-separated).
# Add the deployed frontend origin here before going to production.
#security.cors.allowed-origins=http://localhost:4200

# Browser origins allowed to call this API (comma-separated).
# Set CORS_ALLOWED_ORIGINS to the deployed frontend origin in production.
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

spring.jpa.open-in-view=false
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.talabaty=INFO

# --- JWT --------------------------------------------------------------------
# Base64 that must decode to at least 32 bytes (JwtService enforces this).
# The default below is a throwaway development key and is public by definition -
# every deployment MUST set JWT_SECRET to a freshly generated value:
#   openssl rand -base64 32
security.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktaW5zZWN1cmUtc2VjcmV0LWNoYW5nZS1tZSE=}

# Access token validity period in seconds (900 = 15 minutes).
# After expiration, the user must log in again to obtain a new token.
security.jwt.access-token-expiration-seconds=${JWT_EXPIRATION_SECONDS:900}

# In-memory login rate-limit policy.
security.login-rate-limit.max-failed-attempts=${LOGIN_MAX_FAILED_ATTEMPTS:5}
security.login-rate-limit.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}

# --- OTP e-mail -------------------------------------------------------------
# Credentials come from the environment. With MAIL_USERNAME/MAIL_PASSWORD unset
# the context still starts; only OTP delivery is unavailable, so set
# OTP_ENABLED=false when running without SMTP (CI does exactly this).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
otp.enabled=${OTP_ENABLED:true}

admin.seed.email=admin@gmail.com
admin.seed.password=admin123