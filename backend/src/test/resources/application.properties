spring.application.name=backend

# Test database - H2 in-memory
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.main.banner-mode=off

# CORS for tests
security.cors.allowed-origins=http://localhost:4200

spring.jpa.open-in-view=false
spring.jpa.show-sql=false

logging.level.root=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.talabaty=INFO

# JWT
security.jwt.secret=ZGV2LW9ubHktaW5zZWN1cmUtc2VjcmV0LWNoYW5nZS1tZSE=
security.jwt.access-token-expiration-seconds=900

# Login rate limiting
security.login-rate-limit.max-failed-attempts=5
security.login-rate-limit.window-seconds=900

# OTP email - disabled for tests
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
otp.enabled=false

admin.seed.email=admin@gmail.com
admin.seed.password=admin123