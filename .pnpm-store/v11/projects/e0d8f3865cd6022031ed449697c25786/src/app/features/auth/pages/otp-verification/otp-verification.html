<div class="auth-page otp-page">
  <form class="otp-card" (ngSubmit)="verify()">
    <div class="otp-icon">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"></path><rect x="8.5" y="10" width="7" height="6" rx="1"></rect><path d="M10 10V8.5a2 2 0 0 1 4 0V10"></path></svg>
      <span>✉</span>
    </div>

    <h1 class="auth-heading">Check your email</h1>
    <p class="auth-copy">Enter the 6-digit code sent to<br /><strong>{{ email }}</strong></p>

    <div class="otp-inputs">
      @for (digit of digits; track $index) {
        <input
          #otpInput
          type="text"
          inputmode="numeric"
          maxlength="1"
          [value]="digits[$index]"
          (input)="move($index, $event)"
          (keydown)="keydown($index, $event)"
          [attr.aria-label]="'Code digit ' + ($index + 1)"
        />
      }
    </div>

    <div class="timer">◷ <strong>{{ time }}</strong></div>
    <p class="resend">Didn't receive a code? <button type="button" [disabled]="seconds > 0">Resend Code</button></p>
    <button class="primary-btn verify-button" type="submit">Verify & Proceed</button>
    <span class="secure">Secure verification</span>
  </form>
</div>
